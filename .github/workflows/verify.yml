name: Verify

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test change scoping
        run: node --test .github/ci/tests/scope-check.mjs
      - run: node site/check.mjs
      - name: Determine server scope
        id: scope
        run: node .github/ci/scope.mjs
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.full != 'false'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        if: steps.scope.outputs.full != 'false'
        working-directory: server
      - run: npx tsc --noEmit
        if: steps.scope.outputs.full != 'false'
        working-directory: server
      - run: npm test
        if: steps.scope.outputs.full != 'false'
        working-directory: server

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git --redact
      - name: Scan working tree
        run: gitleaks dir --redact .
